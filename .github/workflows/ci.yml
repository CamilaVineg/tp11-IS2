name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Calidad (ruff, black, mypy, pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Crear entorno virtual
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: ruff (formato, PEP8, PEP257 y seguridad)
        run: python -m ruff check src tests

      - name: black (formato consistente)
        run: python -m black --check src tests

      - name: mypy (tipado estricto)
        run: python -m mypy

      - name: pyright (tipado estricto)
        uses: jakebailey/pyright-action@v2
        with:
          version: "1.1.390"
          paths: src

  tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Crear entorno virtual
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: pytest con cobertura minima del 85%
        run: python -m pytest

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: |
            coverage.xml
            htmlcov/

  security:
    name: Seguridad (bandit, truffleHog, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar bandit
        run: python -m pip install bandit

      - name: bandit (analisis estatico de seguridad)
        run: python -m bandit -r src -c pyproject.toml

      - name: Deteccion de secretos con truffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --fail

      - name: pip-audit (vulnerabilidades en dependencias)
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-dev.txt

  docs:
    name: Documentacion (pdoc)
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Generar documentacion
        run: python -m pdoc --output-directory docs ./src

      - name: Publicar documentacion como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: documentacion
          path: docs/