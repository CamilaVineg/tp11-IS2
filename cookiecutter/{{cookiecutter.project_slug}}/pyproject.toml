[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "{{cookiecutter.project_slug}}"
version = "{{cookiecutter.version}}"
description = "{{cookiecutter.description}}"
readme = "README.md"
requires-python = ">={{cookiecutter.python_version}}"
license = { text = "{{cookiecutter.license}}" }
authors = [{ name = "{{cookiecutter.author}}" }]

[tool.black]
line-length = 88
target-version = ["py{{cookiecutter.python_version}}"]

[tool.ruff]
line-length = 88
target-version = "py{{cookiecutter.python_version}}"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "UP", "B", "S", "C4", "RET", "ARG", "PTH"]
ignore = ["D203", "D213", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "ARG", "S101", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "{{cookiecutter.python_version}}"
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov={{cookiecutter.module_name}}",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--cov-fail-under={{cookiecutter.coverage_min}}",
]

[tool.coverage.run]
branch = true
source = ["{{cookiecutter.module_name}}"]

[tool.coverage.report]
fail_under = {{cookiecutter.coverage_min}}
show_missing = true

[tool.pdoc]
output-directory = "docs"
format = "html"
sort-identifiers = false

[tool.bandit]
exclude_dirs = ["tests", "htmlcov", "docs", "dist", "build", ".venv"]